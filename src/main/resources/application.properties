spring.application.name=TalentBridge ATS
spring.datasource.url=jdbc:mysql://localhost:3306/talentbridge_ats?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Hibernate settings to automatically update table structures
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Bootstrap admin (created once on startup if no admin row exists yet)
app.admin.name=Company HR
app.admin.email=hr@talentbridge.com
app.admin.password=Hr@123
app.admin.recruiter-type=RECRUITER
