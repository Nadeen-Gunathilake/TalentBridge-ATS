spring.application.name=TalentBridge ATS

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.jpa.hibernate.ddl-auto=update

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Bootstrap admin (created once on startup if no admin row exists yet)
app.admin.name=Company HR
app.admin.email=hr@talentbridge.com
app.admin.password=${ADMIN_PASSWORD}
app.admin.recruiter-type=RECRUITER

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Active profile (override with SPRING_PROFILES_ACTIVE env var on Railway)
spring.profiles.active=dev